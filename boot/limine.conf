# Timeout in seconds that Limine will use before automatically booting.
timeout: 3

/Zanux (USB Pendrive - Limine Module)
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/disk.img
    cmdline: root=PARTUUID=11223344-5566-7788-99AA-BBCCDDEEFF00

/Zanux (Real Disk - ATA PIO)
    protocol: limine
    path: boot():/boot/kernel
    cmdline: root=PARTUUID=11223344-5566-7788-99AA-BBCCDDEEFF00
